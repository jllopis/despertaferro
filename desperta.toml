schema_version = 1
name = "despertaferro"
purpose = "Personal configuration runtime for bootstrap, host migration, and agentic automation."

[runtime]
work_tree = "${HOME}"
state_dir = "${XDG_STATE_HOME:-${HOME}/.local/state}/despertaferro"
repo_path = "${XDG_STATE_HOME:-${HOME}/.local/state}/despertaferro/repo.git"
config_dir = "${XDG_CONFIG_HOME:-${HOME}/.config}/despertaferro"
cache_dir = "${XDG_CACHE_HOME:-${HOME}/.cache}/despertaferro"

[git]
remote = "git@github.com:jllopis/despertaferro.git"
default_branch = "main"
host_branch_prefix = "hosts/"
base_branch = "base"
use_git_binary = false

[policy]
default_sync_mode = "dry-run"
auto_track_new_files = false
auto_commit = false
auto_push = false
require_snapshot_before_apply = true
denylist = "config/denylist.txt"
tracked_paths = "config/tracked-paths.txt"

[[hosts]]
name = "gl2arch"
branch = "hosts/gl2arch"
platform = "linux"
profiles = ["base", "arch", "hyprland"]

[[hosts]]
name = "NewCO-Butterfly"
branch = "hosts/NewCO-Butterfly"
platform = "macos"
profiles = ["base", "macos", "work"]

