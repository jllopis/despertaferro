[manager]
ratio          = [1, 4, 3]
sort_by        = "alphabetical"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
show_hidden    = false
show_symlink   = true

[preview]
tab_size   = 2
max_width  = 600
max_height = 900

[opener]
edit = [{ run = 'nvim "$@"', desc = "Edit in Neovim", block = true }]
open = [{ run = 'xdg-open "$@"', desc = "Open" }]
