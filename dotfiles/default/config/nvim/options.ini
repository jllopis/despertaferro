# OPTIONS PARA REVISAR
# Formato: OPCIÓN | VALOR | DESCRIPCIÓN
# Elimina las líneas que NO quieras

# ENCODING
encoding | utf8 | Standard encoding
fileencoding | utf-8 | File encoding
ffs | unix,dos,mac | File format types

# HISTORY & PERSISTENCE
history | 2000 | Number of lines to remember
autoread | true | Auto-read when file changes externally
autowrite | true | Auto-save before :next, :make, etc
shada | !,%,'100,<50,s100 | Remember info about open buffers

# FILE HANDLING
backup | false | Turn backup off
writebackup | false | Don't write backup
swapfile | false | No swap file
undofile | true | Enable undo file
undodir | ~/.cache/nvim/undodir | Undo directory location

# CONCEALMENT & DISPLAY
conceallevel | 1 | Concealment level for markers
title | true | Show title in terminal
showcmd | false | Show command in bottom bar
cmdheight | 1 | Command line height
laststatus | 2 | Always show status line
ruler | true | Show cursor position

# MOUSE & SCROLLING
mouse | a | Enable mouse in all modes (if available)
scrolloff | 10 | Lines to keep visible above/below cursor
sidescrolloff | 5 | Columns to keep visible left/right

# COLOR & UI
colorcolumn | 120,150 | Vertical lines on columns
cursorline | true | Highlight current line
cursorcolumn | false | Don't highlight current column
background | dark | Dark background

# SYNTAX & PERFORMANCE
synmaxcol | 300 | Max columns for syntax highlighting
re | 1 | Use old regex engine for speed

# SEARCH & SUBSTITUTION
hlsearch | false | Don't highlight search results
incsearch | true | Show matches while typing
magic | true | Use magic in regular expressions
inccommand | split | Show substitution preview in split (neovim)

# WHITESPACE VISUALIZATION
list | true | Show invisible characters
listchars | tab:'» ',trail:'·',extends:'#',nbsp:'␣' | Whitespace characters display

# INDENTATION & TEXT
tabstop | 4 | Tab width (NOTA: ya tienes 2)
softtabstop | 4 | Soft tab width
shiftwidth | 4 | Shift width (NOTA: ya tienes 2)
smarttab | true | Smart tab handling
autoindent | true | Auto-indent on new line
textwidth | 0 | No automatic line wrapping
wrapmargin | 0 | No wrap margin

# FOLDING
foldenable | true | Enable folding
foldmethod | syntax | Fold based on syntax
foldlevelstart | 99 | Start with all folds open

# SHELL
shell | (os-dependent) | Set to /usr/bin/zsh (Linux) or /usr/local/bin/zsh (macOS)

# SPECIAL CHARACTERS
isfname | @-@ | Add @ and - to filename characters
display | lastline | Display last incomplete line

# TIMEOUT
timeout | false | No timeout on key codes
ttimeoutlen | 10 | Timeout for key codes
timeoutlen | 500 | Timeout for mapped sequences
tm | 500 | Timeout (duplicate of above)
updatetime | 50 | CursorHold update time (NOTA: ya tienes 250)

# ERRORS & SOUND
errorbells | false | No error sounds
visualbell | false | No visual bell

# BUFFER MANAGEMENT
hidden | true | Allow hidden buffers
backspace | indent,eol,start | More powerful backspace

# WORD WRAP (conflicts with previous settings - review these)
wrap | true | Enable word wrap (BUT you have wrap=false above)
linebreak | true | Break by word rather than character
