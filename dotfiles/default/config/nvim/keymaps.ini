# KEYMAPS PARA REVISAR
# Formato: MODO | ATAJO | DESCRIPCIÓN / COMANDO
# Elimina las líneas que NO quieras

# CONFIGURACIÓN
n | <leader>r | Reload config file
n | <leader>cd | Switch CWD to the directory of the open buffer

# EDICIÓN
v | J | Move line down (visual mode)
v | K | Move line up (visual mode)
n | J | Join lines, preserving cursor position
n | <C-d> | Page down, keep cursor centered
n | <C-u> | Page up, keep cursor centered
n | n | Next search result, keep centered and visible
n | N | Previous search result, keep centered and visible
x | <leader>p | Paste without losing selection (void register)
n | Y | Yank from cursor to end of line
n | <leader>d | Delete to void register
v | <leader>d | Delete to void register
n,v,x | gy | Copy to system clipboard
n,v,x | gp | Paste from system clipboard
n | gY | Copy line to system clipboard
n | <leader>s | Replace word under cursor (substitute)
n | <leader>x | Make current file executable

# TABS
'' | te | Open tabedit in current directory
'' | <S-Tab> | Previous tab
'' | <Tab> | Next tab
'' | <leader>tn | New tab
'' | <leader>to | Tab only (close others)
'' | <leader>tc | Close tab
'' | <leader>tm | Move tab
'' | <leader>tk | Next tab
'' | <leader>tj | Previous tab
n | <Leader>tl | Toggle between current and last tab

# VENTANAS
n | <leader>+ | Vertical resize +5
n | <leader>- | Vertical resize -5
n | <leader>rp | Reset resize to 100
n | ss | Split window horizontally
n | sv | Split window vertically
n | , | Switch to next window
n | s<left> | Move to left window
n | s<up> | Move to up window
n | s<down> | Move to down window
n | s<right> | Move to right window
n | sh | Move to left window (alternative)
n | sk | Move to up window (alternative)
n | sj | Move to down window (alternative)
n | sl | Move to right window (alternative)
n | <C-w><left> | Resize window left
n | <C-w><right> | Resize window right
n | <C-w><up> | Resize window up
n | <C-w><down> | Resize window down

# TERMINAL
n | <leader>o | Open terminal in split window (10 lines height)

# OTROS
n | <leader>f | Format buffer (LSP format)
n | <leader><leader> | Source current file
