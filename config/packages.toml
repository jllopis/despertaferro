# despertaferro package catalog
# profiles: base, arch, macos, hyprland, work
# platforms: linux, macos
# install methods: pacman (+ aur via yay/paru), brew (+ brew_cask), script, skip

# ─── Shells & prompts ─────────────────────────────────────────────────────────

[[package]]
id = "zsh"
description = "Z Shell"
profiles = ["base", "test"]
platforms = ["linux", "macos"]
config_paths = ["~/.config/zsh", "~/.zshrc", "~/.zprofile", "~/.zshenv"]
pacman = "zsh"
brew = "zsh"
post_cmd = "chsh -s /usr/bin/zsh"

[[package]]
