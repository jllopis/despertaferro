name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    strategy:
      matrix:
        target:
          - x86_64-linux-musl
          - aarch64-linux-musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: korandoru/setup-zig@v1
        with:
          zig-version: 0.16.0

      - name: Build ${{ matrix.target }}
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desperta-${{ matrix.target }}
          path: zig-out/bin/desperta

  create-release:
    needs: build-linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Prepare release assets
        run: |
          mkdir -p release
          cp desperta-x86_64-linux-musl/desperta release/desperta-linux-x86_64
          cp desperta-aarch64-linux-musl/desperta release/desperta-linux-aarch64
          chmod +x release/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/desperta-*
          body: |
            Pre-built binaries for despertaferro.

            ### Supported targets
            - `desperta-linux-x86_64` — x86_64 with musl libc (runs on any Linux)
            - `desperta-linux-aarch64` — ARM64 with musl libc (runs on any Linux)

            ### Installation
            ```sh
            ARCH=$(uname -m)  # x86_64 or aarch64
            curl -fsSL \
              "https://github.com/jllopis/despertaferro/releases/download/$(git describe --tags)/desperta-linux-${ARCH}" \
              -o "$HOME/.local/bin/desperta"
            chmod +x "$HOME/.local/bin/desperta"
            ```
